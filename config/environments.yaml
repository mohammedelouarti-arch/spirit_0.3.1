  language_code: "fr-CA"
  creds_path: null

  # Bound into the DFCX session as `nga_agent_id` on the inbound hop, so the
  # `Trigger NGA` payload can resolve `$session.params.nga_agent_id` into a
  # real app instead of passing the literal through. Defaults to `app_name`;
  # set explicitly if the handback target differs from the steering app.
  nga_app_name: "projects/prj-nts-uat-va-dlgflw/locations/us/apps/5d884fb6-d176-4b8d-858c-0d7cf78adb9c"
  nga_agent_id_param: "nga_agent_id"

  # Telephony assigns `call_id` on real calls; a SCRAPI-driven session has none,
  # which leaves `call_id` / `call_id_ref` as unresolved literals in DFCX
  # session state. Leave null to derive a stable numeric id from the session id.
  call_id: null
  call_id_param: "call_id"

