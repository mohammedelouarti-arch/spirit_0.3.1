[project]
name = "nga-dfcx-test-automation"
version = "0.6.0"
description = "Multi-leg NGA <-> Dialogflow CX handoff automation with an Ollama-driven customer"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "google-auth>=2.30.0",
  "google-cloud-dialogflow-cx>=1.34.0",
  "cxas-scrapi>=1.8.0",
  "ollama>=0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
