evals:
  - name: "bill_promo_expired_nga_to_dfcx"
    tags: ["smoke", "e2e", "billing", "fr-ca"]
    session_start:
      event: "session start"
      variables:
        NGA: "true"
        brand: "Bell"
        menu_type: "ivr_menu"
        language_tmp: "fr-CA"
        clid_tmp: "+18663102355"
        tfn_tmp: "+19058743160"
    wrapper_steps:
      - {kind: "dtmf", input: "157", label: "tester_id"}
      - {kind: "dtmf", input: "8000212355", label: "spoof_tfn"}
      - {kind: "dtmf", input: "4169326321", label: "spoof_clid"}
      - {kind: "text", input: "Non", label: "infobot_choice"}
    identification_steps:
      - {kind: "dtmf", input: "4169236321", label: "customer_identification"}
      - {kind: "text", input: "Oui", label: "service_confirmation"}
    steering_utterance: "J'essaie de régler une offre promotionnelle qui est expirée."
    expected_transfer:
      environment: "projects/prj-nts-uat-va-dlgflw/locations/us-central1/agents/f9166dae-1a9a-479b-aab7-136b1d13e36a/environments/3db63fc6-2100-418c-bf21-51ef4cb2f45e"
      route: "bill_promo_expired"
      language: "fr-ca"
      handoff_to: "post_steering"
    # Everything below the steering utterance is generated by Ollama.
    autonomous_flow:
      enabled: true
      max_turns: 8
      customer_goal: >
        The customer had a promotional offer that expired and wants to understand why,
        and whether another promotion, discount, or equivalent offer can be applied.
      customer_profile: >
        The customer speaks Canadian French, responds briefly and naturally,
        cooperates with relevant questions, and stays focused on resolving the issue.
      stop_phrases:
        - "au revoir"
        - "bonne journée"
        - "merci d'avoir appelé"
        - "je vais vous transférer"
        - "transfert vers un conseiller"
    expected_conversation:
      min_turns: 2
      max_turns: 8
      must_mention: ["promotion"]
      must_not_mention: ["je ne comprends pas", "erreur système"]
      forbid_stop_reasons: ["max_turns", "empty_llm_response", "no_va_text"]
      require_empty_user_turns: false
